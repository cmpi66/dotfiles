#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
blacklist = ["popup"]

# keep an eye on this for tmux server restarts and stale sessions
cache = true

sort_order = [
    "tmux",
    "tmuxinator", # show first
    "config",
    "zoxide", # show last
]

[tui]
prompt = "⚡"
placeholder = "Choose a session"
show_icons = true
show_windows = true
alias_auto_connect_delay = "150ms"
alias_filter_prefix = "/"
preview = false
preview_width = 60
preview_min_width = 100
preview_border = "line"
group_separator = true

# [[session]]
# name = "sesh"
# path = "~/c/sesh"
# icon = ""


[icons]
tmux = { icon = "🪟" }
tmuxinator = { icon = "🧩" }
config = { icon = "🔧" }
zoxide = { icon = "📁" }
