[audio]
enable_overdrive = true

[bar.default]
capsule = true
center = [ "workspaces" ]
concave_edge_corners = false
end = [
    "bar",
    "weather",
    "media",
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clock"
]
font_weight = 700
margin_ends = 0
position = "bottom"
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
start = [ "cpu", "ram", "temp", "active_window" ]
thickness = 26

[config]

[control_center.calendar]
show_week_numbers = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
show_dots = true

[location]
auto_locate = true

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
scale = 0.85000000521540642

[osd]
enabled = false

[plugins]
enabled = [ "noctalia/timer" ]

[shell]
app_icon_colorize = true
clipboard_enabled = false
lang = "en"
show_location = false

    [shell.animation]
    enabled = false

    [shell.panel]
    open_near_click_control_center = true

[templates]

[theme]
builtin = "Catppuccin"
custom_palette = "catppuccin-mine"
mode = "light"
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/chris/.local/share/wallpapers"
fill_mode = "fit"

    [wallpaper.default]
    path = "/home/chris/.local/share/wallpapers/windows-xp.jpg"

    [wallpaper.last]
    path = "/home/chris/.local/share/wallpapers/windows-xp.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/chris/.local/share/wallpapers/windows-xp.jpg"

[weather]
unit = "imperial"

[widget.bar]
type = "noctalia/timer:bar"

[widget.clock]
format = "{:%H:%M:%S} {:%a %d %b}"

[widget.media]
hide_when_no_media = true

[widget.workspaces]
empty_color = "on_surface_variant"
focused_color = "tertiary"
scale = 1.25
