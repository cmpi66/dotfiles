[general]
pgp-provider=gpg
term=kitty

[ui]
index-columns=flags:4,name<20%,subject,date>=
# styleset-name=catppuccin-macchiato
styleset-name=catppuccin-latte
border-char-vertical="│"
border-char-horizontal="─"

# Faster navigation (no delay)
dirlist-delay=0ms

# Clean UX
auto-mark-read=true
new-message-bell=false

# Better date signal
timestamp-format=2006-01-02
this-day-time-format=15:04

# Icons (clean, not noisy)
fuzzy-complete=true
icon-new=📧
icon-attachment=📎
icon-old=📧
icon-replied=📝
icon-flagged=🚩
icon-deleted=🗑️
icon-unencrypted = 🔓
icon-encrypted = 🔒
icon-signed = ✔
icon-signed-encrypted = ✅

[statusline]

[viewer]
pager = bat --pager=always
always-show-mime = true
max-mime-height = 5

# FAST + usable
parse-http-links=true

[compose]
editor=nvim
focus-body=false
file-picker-cmd=yazi --chooser-file=%f
address-book-cmd = sh -c 'abook --mutt-query "%s" | tail -n +2'

[filters]
# Plain stays clean
text/plain=colorize

# HTML → readable + fast
text/html=! w3m -T text/html -o display_link_number=1 -I UTF-8

# fallback
message/rfc822=colorize

[openers]
# browser
x-scheme-handler/http*=qutebrowser {}
text/html = qutebrowser {}

# attachments (fast + sane defaults)
image/*=swayimg {}
application/pdf=zathura {}
text/*=nvim {}
