# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Sets user-defined palette
# Palettes must be defined _after_ this line
palette = "catppuccin_latte"

# Starship modules
[character]

success_symbol = "[❯](bold green) "
error_symbol = "[](bold red) "
vicmd_symbol = '[N](bold blue) '
vimcmd_replace_one_symbol = '[❮](bold yellow)'
vimcmd_replace_symbol = '[❮](bold red)'
vimcmd_visual_symbol = '[V](bold mauve)'

[line_break]
disabled = false

#Disable the package module, hiding it from the prompt completely
[package]
disabled = true


[golang]
style = 'blue'
symbol = " "

[rust]
style = 'orange'
symbol = ' '

[lua]
symbol = ' '

[python]
style = 'yellow'
symbol = '  '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = false
pyenv_prefix = ''

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = ' '
style = 'sky'
format = " docker [$symbol$context]($style)"
# detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
# detect_extensions = ['Dockerfile']


[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[directory]
truncate_to_repo = false
style = "bold blue"
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'


[git_branch]
style = "bold mauve"
format = "[$symbol$branch]($style) "
symbol = " "

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"


[hostname]
ssh_only = true
format = "[$hostname](bold yellow) "

[hostname.aliases]
artixframe = "󰌢 artixframe"
gentoobox = "󰣨 gentoobox"
